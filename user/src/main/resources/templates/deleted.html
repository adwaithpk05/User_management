<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Success</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Navigation */
        .navigation {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
        }

        .nav-btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Main container */
        .container {
            width: 450px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        /* Links */
        .action-link {
            display: block;
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 12px;
            margin: 12px 0;
            border-radius: 7px;
            font-size: 16px;
            transition: 0.3s;
        }

        .action-link:hover {
            background: #5568d8;
        }
    </style>
</head>

<body>

<!-- Navigation -->
<div class="navigation">

    <button class="nav-btn" type="button" onclick="history.back()">
        ← Back
    </button>

    <a class="nav-btn" th:href="@{/home}">
        🏠 Home
    </a>

</div>


<!-- Success Message -->
<div class="container">

    <h1 th:text="${message}"></h1>

    <a class="action-link" th:href="@{/users/add}">
        ➕ Add another user
    </a>

    <a class="action-link" th:href="@{/users/delete}">
        🗑 Delete another user
    </a>

    <a class="action-link" th:href="@{/users}">
        👥 View users
    </a>

</div>

</body>
</html>
