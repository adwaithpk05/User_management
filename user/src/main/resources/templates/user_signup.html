<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Sign Up</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 p-5"
         style="max-width: 450px; width: 100%; border-radius: 20px;">

        <div class="text-center mb-4">
            <h2 class="fw-bold">Create Account</h2>
            <p class="text-muted">Sign up as a user</p>
        </div>

        <form th:action="@{/user/signup}" th:object="@{signuprequest}" method="post">

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>

                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>

                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <!-- Mobile Number -->
            <div class="mb-3">
                <label for="mobNumber" class="form-label">
                    Mobile Number
                </label>

                <input type="tel"
                       class="form-control"
                       id="mobNumber"
                       name="mobNumber"
                       placeholder="Enter your mobile number"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Create a password"
                       required>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm your password"
                       required>
            </div>

            <!-- Signup Button -->
            <button type="submit"
                    class="btn btn-primary btn-lg w-100">
                Sign Up
            </button>

        </form>

        <!-- Login -->
        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a href="/user/login"
               class="text-decoration-none fw-semibold">
                Login
            </a>

        </div>

        <!-- Back -->
        <div class="text-center mt-3">

            <button class="nav-btn"
                    type="button"
                    onclick="history.back()">
                ← Back
            </button>

        </div>

    </div>

</div>

</body>
</html>
