<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Delete User</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Navigation */
        .navigation {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
        }

        .nav-btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Delete form */
        .container {
            width: 400px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        h3 {
            margin-bottom: 20px;
            color: #555;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .delete-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #5568d8;
        }
    </style>
</head>

<body>

<!-- Navigation -->
<div class="navigation">

    <button class="nav-btn" type="button" onclick="history.back()">
        ← Back
    </button>

    <a class="nav-btn" th:href="@{/home}">
        🏠 Home
    </a>

</div>


<!-- Delete User Form -->
<div class="container">

    <h1>Delete User</h1>

    <form th:action="@{/users/delete}" method="post">

        <h3>Enter the user ID</h3>

        <label>Id:</label>
        <input type="number" name="id" required>

        <button class="delete-btn" type="submit">
            Delete User
        </button>

    </form>

</div>

</body>
</html>
