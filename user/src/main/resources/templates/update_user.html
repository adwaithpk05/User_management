<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update User</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Navigation */
        .navigation {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
        }

        .nav-btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Main container */
        .container {
            width: 420px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        h3 {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Validation error */
        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* Update button */
        .update-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .update-btn:hover {
            background: #5568d8;
        }

    </style>
</head>

<body>

<!-- Navigation -->
<div class="navigation">

    <button class="nav-btn"
            type="button"
            onclick="history.back()">
        ← Back
    </button>

    <a class="nav-btn"
       th:href="@{/home}">
        🏠 Home
    </a>

</div>


<!-- Main Update Form -->
<div class="container">

    <h1>Update User</h1>

    <form th:action="@{/users/update}"
          th:object="${user}"
          method="post">

        <h3>Enter the user details</h3>


        <!-- ================= ID ================= -->

        <label>ID:</label>

        <input type="number"
               th:field="*{id}"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('id')}"
             th:errors="*{id}">
        </div>


        <!-- ================= NAME ================= -->

        <label>Name:</label>

        <input type="text"
               th:field="*{name}"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>


        <!-- ================= EMAIL ================= -->

        <label>Email:</label>

        <input type="email"
               th:field="*{email}"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>


        <!-- ================= MOBILE ================= -->

        <label>Mobile:</label>

        <input type="text"
               th:field="*{mobNumber}"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('mobNumber')}"
             th:errors="*{mobNumber}">
        </div>


        <!-- ================= BUTTON ================= -->

        <button class="update-btn"
                type="submit">
            Update User
        </button>

    </form>

</div>

</body>
</html>
